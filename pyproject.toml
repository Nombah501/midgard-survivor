[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midgard-farm"
version = "0.3.9"
description = "Midgard Farm: AFK farmer service and window for Midgard Survivors"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8", "PyNaCl>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "packaging>=24"]
freeze = ["PyInstaller==6.22.3", "packaging>=24"]

[project.scripts]
midgard-farm-service = "midgard_farm.service:main"
midgard-farm-setup = "midgard_farm.setup:main"

[project.gui-scripts]
midgard-farm = "midgard_farm.gui:main"

[tool.setuptools]
# Map the data-only package to the canonical sources without copying into the checkout.
package-dir = {"" = "src", "midgard_farm._farmer" = "farmer"}
packages = [
    "midgard_farm", "midgard_farm._farmer", "midgard_farm.core",
    "midgard_farm.core.farmer_patch", "midgard_farm.gui", "midgard_farm.platform",
    "midgard_farm.verify",
]
include-package-data = false

[tool.setuptools.package-data]
"midgard_farm._farmer" = [
    "src/farmer.gd", "src/save_hook.gd",
    "tools/inject_hook.py", "tools/patch_player.py",
    "presets/*.json", "scenarios/one-run.json", "targets.json",
    "obsolete_config_keys.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
