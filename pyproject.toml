[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midgard-farm"
version = "0.1.0"
description = "Midgard Farm: AFK farmer service and window for Midgard Survivors"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
midgard-farm-service = "midgard_farm.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
