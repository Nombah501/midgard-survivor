name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt runtime libraries (offscreen window tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Types (this OS's platform module; the other one is excluded)
        shell: bash
        run: |
          python -m pip install mypy
          if [ "$RUNNER_OS" = "Windows" ]; then target=win32; other=linux; else target=linux; other=windows; fi
          python -m mypy --python-version 3.13 --platform "$target" --follow-imports=silent \
            --exclude "midgard_farm/platform/${other}\.py$" src
      - name: App tests (platform seam against the real OS)
        run: python -m pytest -v tests
      - name: Farmer tests (supervisor, run.sh; Linux until cutover)
        if: runner.os == 'Linux'
        working-directory: farmer
        run: python -m pytest -q tests

  package:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install the app wheel and PyInstaller
        run: python -m pip install ".[freeze]"
      - name: Build the shared onedir
        run: python -m PyInstaller --noconfirm --clean packaging/midgard-farm.spec
      - name: Smoke-test both roles with no Python on PATH
        run: python packaging/check_onedir.py dist/midgard-farm
      - name: Check the tag and archive the onedir
        shell: bash
        run: python packaging/archive_release.py dist/midgard-farm release-assets "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: midgard-farm-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: midgard-farm-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish all four assets to the private repository
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          base="midgard-farm-${GITHUB_REF_NAME#v}"
          linux="$base-linux-x86_64.tar.gz"
          windows="$base-windows-x86_64.zip"
          sha256sum --check "$linux.sha256" "$windows.sha256"
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "$linux" "$linux.sha256" "$windows" "$windows.sha256"
