name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt runtime libraries (offscreen window tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: App tests (platform seam against the real OS)
        run: python -m pytest -v tests
      - name: Farmer tests (supervisor, run.sh; Linux until cutover)
        if: runner.os == 'Linux'
        working-directory: farmer
        run: python -m pytest -q tests
