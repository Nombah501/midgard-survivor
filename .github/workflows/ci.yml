name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt runtime libraries (offscreen window tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Types (this OS's platform module; the other one is excluded)
        shell: bash
        run: |
          python -m pip install mypy
          if [ "$RUNNER_OS" = "Windows" ]; then target=win32; other=linux; else target=linux; other=windows; fi
          python -m mypy --python-version 3.13 --platform "$target" --follow-imports=silent \
            --exclude "midgard_farm/platform/${other}\.py$" src
      - name: App tests (platform seam against the real OS)
        run: python -m pytest -v tests
      - name: Farmer tests (supervisor, run.sh; Linux until cutover)
        if: runner.os == 'Linux'
        working-directory: farmer
        run: python -m pytest -q tests

  package:
    needs: test
    outputs:
      # Both runners classify the same installed package version.
      prerelease: ${{ steps.archive.outputs.prerelease }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install the app wheel and PyInstaller
        run: python -m pip install ".[freeze]"
      - name: Build the shared onedir
        run: python -m PyInstaller --noconfirm --clean packaging/midgard-farm.spec
      - name: Check the tag and archive the onedir
        id: archive
        shell: bash
        run: python packaging/archive_release.py dist/midgard-farm release-assets "$GITHUB_REF_NAME"
      - name: Smoke-test both extracted roles with no Python on PATH
        env:
          RELEASE_ARCHIVE: ${{ steps.archive.outputs.archive }}
        shell: bash
        run: python packaging/check_onedir.py "release-assets/$RELEASE_ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: midgard-farm-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: midgard-farm-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish all four assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        shell: bash
        run: |
          base="midgard-farm-${GITHUB_REF_NAME#v}"
          linux="$base-linux-x86_64.tar.gz"
          windows="$base-windows-x86_64.zip"
          sha256sum --check "$linux.sha256" "$windows.sha256"
          test "$PRERELEASE" = true || test "$PRERELEASE" = false
          assets=("$linux" "$linux.sha256" "$windows" "$windows.sha256")
          if flags=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(" ")'); then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            if [ "$flags" != "false $PRERELEASE" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --prerelease="$PRERELEASE" "${assets[@]}"
          fi
      - uses: actions/setup-python@v6
        if: needs.package.outputs.prerelease == 'false'
        with:
          python-version: "3.13"
      - name: Install stable channel publishing tools
        if: needs.package.outputs.prerelease == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          python -m pip install 'PyNaCl>=1.6,<2'
      - name: Publish immutable archives and then the signed stable manifest to R2
        if: needs.package.outputs.prerelease == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_EC2_METADATA_DISABLED: "true"
          PYTHONPATH: src
        run: python packaging/publish_update.py release-assets CHANGELOG.md "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"
      - name: Fetch the stable channel as an installed App does
        if: needs.package.outputs.prerelease == 'false'
        run: python packaging/check_published.py "$GITHUB_REF_NAME"
